name: Build Readex

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MiniApp
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install AIoT build CLI
        run: npm install --global aiot-vue-cli@1.0.32

      - name: Verify AIoT CLI
        run: aiot-cli -V

      - name: Build production package
        run: npm run build:prod

      - name: Verify package
        run: test -s all.amr

      - name: Upload MiniApp package
        uses: actions/upload-artifact@v4
        with:
          name: readex-miniapp
          path: all.amr
          if-no-files-found: error
          retention-days: 14
